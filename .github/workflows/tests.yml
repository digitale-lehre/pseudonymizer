name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    # Feste Runner-Version: Python 3.8 (die aelteste unterstuetzte Version) gibt es auf
    # neueren Runnern nicht mehr.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.13", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt pytest
      # Node.js ist fuer die Gleichlauf-Tests da: Sie fuehren den Code der GUI samt den
      # eingebetteten Bibliotheken aus. Der Testlauf laedt nichts aus dem Netz nach.
      - run: python -m pytest tests -v
