name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt pytest
      # Bibliotheken der GUI fuer die Gleichlauf-Tests. tests/gui_harness.js laedt sie nur,
      # wenn ihre Pruefsumme zu den integrity-Angaben in pseudonym_gui.html passt.
      - run: |
          mkdir -p "$RUNNER_TEMP/libs"
          curl -fsSL -o "$RUNNER_TEMP/libs/xlsx.full.min.js" https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js
          curl -fsSL -o "$RUNNER_TEMP/libs/jszip.min.js" https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js
          echo "PSEUDO_GUI_LIBS=$RUNNER_TEMP/libs" >> "$GITHUB_ENV"
      - run: python -m pytest tests -v
